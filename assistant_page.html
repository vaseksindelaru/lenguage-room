<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 KRK-9 — Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding-top: 56px; display: flex; flex-direction: column; }
  /* ─── Top Nav Bar ─────────────────────── */
  .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1001;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px; background: rgba(22,33,62,0.85);
      backdrop-filter: blur(12px); border-bottom: 1px solid #2a2a4a;
  }
  .top-nav a { color: #ccc; text-decoration: none; font-size: .9rem; font-weight: 600;
      padding: 6px 14px; border-radius: 8px; transition: all .15s; }
  .top-nav a:hover { background: rgba(88,101,242,0.15); color: #5865f2; }
  .top-nav a.active { background: rgba(88,101,242,0.2); color: #5865f2; border-bottom: 2px solid #5865f2; }
  .top-nav .brand { color: #5865f2; font-size: 1.1rem; font-weight: 700; }
  .top-nav .nav-links { display: flex; gap: 6px; align-items: center; }

  /* ─── Chat Layout ─────────────────────── */
  .chat-container { max-width: 700px; margin: 20px auto; flex: 1; display: flex; flex-direction: column; padding: 0 16px; width: 100%; }
  .messages { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .msg {
      background: rgba(22,33,62,0.7); backdrop-filter: blur(8px);
      border: 1px solid #2a2a4a; border-radius: 12px; padding: 14px 18px;
      max-width: 85%; animation: fadeIn .2s ease;
  }
  .msg.user { align-self: flex-end; background: rgba(88,101,242,0.15); border-color: rgba(88,101,242,0.3); }
  .msg.assistant { align-self: flex-start; }
  .msg .role { font-size: .75rem; font-weight: 700; margin-bottom: 4px; }
  .msg.user .role { color: #5865f2; }
  .msg.assistant .role { color: #57f287; }
  .msg .text { font-size: .9rem; line-height: 1.5; white-space: pre-wrap; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .input-bar {
      display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid #2a2a4a;
      align-items: flex-end;
  }
  .input-bar textarea {
      flex: 1; background: #0f0f1a; border: 1px solid #2a2a4a; border-radius: 8px;
      padding: 10px 14px; color: #ddd; font-family: 'Inter', sans-serif; font-size: .9rem;
      resize: none; min-height: 42px; max-height: 120px; outline: none;
      transition: border-color .15s;
  }
  .input-bar textarea:focus { border-color: #5865f2; }
  .input-bar button {
      padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600;
      cursor: pointer; transition: all .15s; font-size: .9rem; white-space: nowrap;
  }
  .btn-send { background: #5865f2; color: #fff; }
  .btn-send:hover { background: #4752c4; }
  .btn-send:disabled { opacity: .5; cursor: not-allowed; }
  .btn-voice { background: #2a2a4a; color: #ccc; font-size: 1.2rem; padding: 10px 14px; }
  .btn-voice:hover { background: #3a3a5a; color: #fff; }
  .btn-voice.recording { background: #ed4245; color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(237,66,69,0.4); } 50% { box-shadow: 0 0 0 8px rgba(237,66,69,0); } }

  .status-bar { font-size: .8rem; color: #666; text-align: center; padding: 4px; }

  .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1e3a5f; border: 1px solid #5865f2; color: #fff;
      padding: 12px 24px; border-radius: 8px; font-size: .9rem;
      z-index: 8000; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: #3a1e1e; border-color: #ed4245; }

  @media (max-width: 600px) {
      .top-nav .nav-links { gap: 2px; }
      .top-nav a { font-size: .75rem; padding: 4px 8px; }
  }
</style>
</head>
<body>
<!-- ─── Top Navigation Bar ─────────────────────── -->
<nav class="top-nav">
    <a href="/" class="brand">🎧 KRK-9</a>
    <div class="nav-links">
        <a href="/">🏠 Salas</a>
        <a href="/chat">💬 Practice</a>
        <a href="/news">📰 Briefing</a>
        <a href="/assistant" class="active">🤖 Assistant</a>
    </div>
</nav>

<div class="chat-container">
    <div class="messages" id="messages"></div>
    <div class="input-bar">
        <button class="btn-voice" id="btnVoice" onclick="toggleVoice()" title="Hold to speak">🎤</button>
        <textarea id="input" placeholder="Type in English..." rows="1"
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
        <button class="btn-send" id="btnSend" onclick="send()">➤</button>
    </div>
    <div class="status-bar" id="statusBar">🤖 KRK-9 Assistant — practice English anytime</div>
</div>

<div class="toast" id="toast"></div>

<script>
const USER_ID = 'legacy_vaclav';
const msgsEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const statusBar = document.getElementById('statusBar');

function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `<div class="role">${role === 'user' ? '👤 You' : '🤖 KRK-9'}</div><div class="text">${escHtml(text)}</div>`;
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.className = 'toast', 3000);
}

async function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    addMessage('user', text);
    const btn = document.getElementById('btnSend');
    btn.disabled = true; statusBar.textContent = '⏳ KRK-9 está pensando...';
    try {
        const r = await fetch('/api/assistant/chat', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: USER_ID, message: text })
        });
        const data = await r.json();
        if (data.reply) { addMessage('assistant', data.reply); }
        else { showToast('❌ ' + (data.error || 'Sin respuesta'), true); }
    } catch (e) { showToast('❌ ' + e.message, true); }
    finally { btn.disabled = false; statusBar.textContent = '🤖 KRK-9 Assistant — practice English anytime'; }
}

// ─── Voice (PTT) ───────────────────────────
let recognition = null, isRecording = false;
function toggleVoice() {
    if (isRecording) { stopVoice(); } else { startVoice(); }
}
function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('❌ Speech Recognition not supported', true); return; }
    recognition = new SR();
    recognition.lang = 'en-US'; recognition.interimResults = false; recognition.continuous = false;
    recognition.onresult = (e) => { inputEl.value = e.results[0][0].transcript; };
    recognition.onerror = (e) => { showToast('🎤 Error: ' + e.error, true); stopVoice(); };
    recognition.onend = () => stopVoice();
    recognition.start(); isRecording = true;
    document.getElementById('btnVoice').classList.add('recording');
    statusBar.textContent = '🎤 Listening...';
}
function stopVoice() {
    if (recognition) { try { recognition.stop(); } catch(e) {} }
    isRecording = false;
    document.getElementById('btnVoice').classList.remove('recording');
    statusBar.textContent = '🤖 KRK-9 Assistant — practice English anytime';
}

// Welcome message
addMessage('assistant', "Hi! 👋 I'm KRK-9, your English practice assistant. Ask me anything, or we can just chat. Type or use the mic 🎤");
</script>
</body>
</html>
